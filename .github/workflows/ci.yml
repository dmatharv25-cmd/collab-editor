name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test ./... -race -count=1

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Regenerate vectors from the Go implementation
        working-directory: server
        run: go run ./cmd/genvectors
      - name: Install client dependencies
        working-directory: client
        run: npm ci
      - name: Type-check
        working-directory: client
        run: npx tsc --noEmit
      - name: Run TypeScript tests (including Go conformance)
        working-directory: client
        run: npm test
