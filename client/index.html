<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>collab-editor</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
      header { display: flex; justify-content: space-between; align-items: baseline; }
      #status { font-size: 0.9rem; }
      #status.on { color: #1a7f37; }
      #status.off { color: #cf222e; }
      textarea { width: 100%; height: 60vh; font: 16px/1.5 ui-monospace, monospace; padding: 0.75rem; box-sizing: border-box; }
      small { color: #666; }
    </style>
  </head>
  <body>
    <header>
      <h1>collab-editor</h1>
      <span id="status" class="off">connecting...</span>
    </header>
    <textarea id="editor" placeholder="Start typing. Open this page in a second tab to edit together."></textarea>
    <small id="info"></small>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
